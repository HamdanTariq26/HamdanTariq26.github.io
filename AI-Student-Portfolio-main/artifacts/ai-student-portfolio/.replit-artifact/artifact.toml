kind = "web"
previewPath = "/"
title = "AI Student Portfolio"
description = "A polished personal portfolio homepage for an Artificial Intelligence undergraduate at NUST Balochistan Campus, showcasing practical intelligent systems work, interests, and professional direction."
version = "1.0.0"
id = "artifacts/ai-student-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23538

[services.development]
run = "pnpm --filter @workspace/ai-student-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-student-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-student-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23538"
BASE_PATH = "/"
